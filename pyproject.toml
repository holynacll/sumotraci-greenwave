[project]
name = "sumotraci"
version = "0.1.0"
description = "SumoTraCI Greenwave Simulation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "eclipse-sumo>=1.21.0",
    "pandas>=2.2.3",
    "seaborn>=0.13.2",
    "ipykernel>=6.29.5",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "typer>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sumotraci"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-requests",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]  # pycodestyle, pyflakes, isort, warnings
ignore = []

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
